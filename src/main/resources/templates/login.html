<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Product CRUD</title>
    <!-- Memuat Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-gray-50">
<div class="container-tailwind max-w-7xl mx-auto px-4">
    <div class="flex justify-center mt-16">
        <!-- Lebar form dibatasi max-w-md agar tidak terlalu lebar -->
        <div class="w-full max-w-md">
            <!-- Kartu form login dengan shadow dan sudut membulat -->
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h3 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h3>

                <!--
                  Alert error: tampil jika parameter "error" ada di URL.
                  Artinya username atau password yang dimasukkan salah.
                -->
                <div th:if="${param.error}" class="bg-red-100 text-red-700 border border-red-200 px-4 py-3 rounded-lg mb-4">
                    Username atau password salah!
                </div>

                <!--
                  Alert info: tampil jika parameter "logout" ada di URL.
                  Artinya user baru saja berhasil logout.
                -->
                <div th:if="${param.logout}" class="bg-blue-100 text-blue-700 border border-blue-200 px-4 py-3 rounded-lg mb-4">
                    Berhasil logout.
                </div>

                <!--
                  Alert sukses: tampil jika ada flash attribute "success".
                  Biasanya dikirim setelah registrasi berhasil.
                -->
                <div th:if="${success}" class="bg-green-100 text-green-700 border border-green-200 px-4 py-3 rounded-lg mb-4" th:text="${success}"></div>

                <!-- Form login - dikirim ke endpoint /login dengan method POST -->
                <form th:action="@{/login}" method="post" class="space-y-5">
                    <!-- Input username -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" id="username" name="username"
                               placeholder="Masukkan username" required autofocus>
                    </div>
                    <!-- Input password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" id="password" name="password"
                               placeholder="Masukkan password" required>
                    </div>
                    <!-- Tombol submit login -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors duration-200">Login</button>
                </form>

                <!-- Link ke halaman registrasi -->
                <div class="text-center mt-5 text-gray-600">
                    <span>Belum punya akun? </span>
                    <a th:href="@{/register}" class="text-blue-600 hover:text-blue-800 hover:underline font-medium">Daftar di sini</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
