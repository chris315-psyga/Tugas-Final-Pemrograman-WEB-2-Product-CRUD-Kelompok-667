<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}"></head>
<body>
<!-- Menyisipkan navbar dari fragment -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Konten utama halaman beranda -->
<div class="container-tailwind max-w-7xl mx-auto px-4">
    <div class="flex justify-center mt-20">
        <!-- Maksimal lebar 3 kolom untuk teks yang mudah dibaca -->
        <div class="max-w-3xl text-center">
            <!-- Judul utama halaman -->
            <h1 class="text-5xl font-bold text-gray-800 mb-6">Selamat Datang di Product CRUD</h1>

            <!-- Deskripsi / penjelasan singkat aplikasi -->
            <p class="text-xl text-gray-600 mb-8 leading-relaxed">
                Aplikasi manajemen produk sederhana untuk praktikum JPA Fundamentals.
                Saat ini data disimpan di dalam memori (ArrayList). Pada praktikum berikutnya,
                Anda akan menambahkan JPA untuk menyimpan data ke database.
            </p>

            <!-- Tombol CTA untuk menuju daftar produk -->
            <a th:href="@{/products}"
               class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-lg px-8 py-3 rounded-lg font-medium transition-colors duration-200 shadow-md hover:shadow-lg">
                Lihat Daftar Produk
            </a>
        </div>
    </div>
</div>

<!-- Menyisipkan footer dari fragment -->
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
