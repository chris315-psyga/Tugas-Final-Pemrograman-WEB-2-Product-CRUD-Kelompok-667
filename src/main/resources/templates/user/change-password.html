<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-tailwind max-w-7xl mx-auto px-4 mt-8">
    <div class="flex justify-center">
        <div class="w-full max-w-lg">
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="bg-cyan-600 text-white px-6 py-4">
                    <h4 class="text-lg font-bold">Ganti Password</h4>
                </div>
                <div class="p-6">
                    <div th:if="${error}" id="errorAlert" class="bg-red-100 text-red-700 border border-red-200 px-4 py-3 rounded-lg mb-4 flex justify-between items-center">
                        <span th:text="${error}"></span>
                        <button onclick="document.getElementById('errorAlert').remove()" class="text-red-500 hover:text-red-700 font-bold text-lg leading-none">&times;</button>
                    </div>

                    <form th:action="@{/profile/change-password}"
                          th:object="${changePasswordRequest}"
                          method="post" class="space-y-5">

                        <div>
                            <label for="oldPassword" class="block text-sm font-medium text-gray-700 mb-1">Password Lama</label>
                            <input type="password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" id="oldPassword"
                                   th:field="*{oldPassword}" placeholder="Masukkan password lama" required autofocus>
                        </div>

                        <div>
                            <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
                            <input type="password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" id="newPassword"
                                   th:field="*{newPassword}" placeholder="Masukkan password baru" required>
                        </div>

                        <div>
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password Baru</label>
                            <input type="password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" id="confirmPassword"
                                   th:field="*{confirmPassword}" placeholder="Ulangi password baru" required>
                        </div>

                        <div class="flex gap-3">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors duration-200">Ganti Password</button>
                            <a th:href="@{/profile}" class="bg-gray-500 hover:bg-gray-600 text-white font-medium px-6 py-2.5 rounded-lg transition-colors duration-200">Batal</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <small class="text-gray-500">
                    Pastikan password baru memiliki kombinasi huruf dan angka untuk keamanan.
                </small>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
