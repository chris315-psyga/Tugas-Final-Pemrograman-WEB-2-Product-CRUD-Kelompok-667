<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-tailwind max-w-7xl mx-auto px-4 mt-8">
    <div class="flex justify-center">
        <div class="w-full max-w-3xl">
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="bg-blue-600 text-white text-center px-6 py-5">
                    <h3 class="text-xl font-bold">Profil Gua Nih</h3>
                </div>
                <div class="p-8 text-center">
                    <img th:src="${currentUser.profileImageUrl ?: 'https://via.placeholder.com/150'}"
                         class="rounded-full mx-auto mb-4 shadow-md border-4 border-white"
                         alt="Profile Image"
                         style="width: 150px; height: 150px; object-fit: cover;">

                    <h4 class="text-xl font-bold text-gray-800 mb-6" th:text="${currentUser.fullName ?: currentUser.username}">Nama User</h4>

                    <div class="grid grid-cols-1 sm:grid-cols-2 text-left gap-y-4 gap-x-6 max-w-lg mx-auto">
                        <div class="font-semibold text-gray-700">Username:</div>
                        <div class="text-gray-600" th:text="${currentUser.username}">-</div>

                        <div class="font-semibold text-gray-700">Email:</div>
                        <div class="text-gray-600" th:text="${currentUser.email ?: '-'}">-</div>

                        <div class="font-semibold text-gray-700">No. HP:</div>
                        <div class="text-gray-600" th:text="${currentUser.phoneNumber ?: '-'}">-</div>

                        <div class="font-semibold text-gray-700">Alamat:</div>
                        <div class="text-gray-600" th:text="${currentUser.address ?: '-'}">-</div>

                        <div class="font-semibold text-gray-700">Bio:</div>
                        <div class="text-gray-600" th:text="${currentUser.bio ?: '-'}">-</div>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3 mt-8">
                        <a th:href="@{/profile/edit}" class="bg-yellow-500 hover:bg-yellow-600 text-white font-medium px-6 py-2.5 rounded-lg transition-colors duration-200">Edit Profil</a>
                        <a th:href="@{/profile/change-password}" class="bg-cyan-500 hover:bg-cyan-600 text-white font-medium px-6 py-2.5 rounded-lg transition-colors duration-200">Ganti Password</a>
                        <a th:href="@{/products}" class="bg-gray-500 hover:bg-gray-600 text-white font-medium px-6 py-2.5 rounded-lg transition-colors duration-200">Kembali ke Produk</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
